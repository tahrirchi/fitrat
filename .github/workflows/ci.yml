name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run pyright src/

      - name: Test
        run: uv run pytest tests/ -v

  compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install compile dependencies
        run: uv sync --extra compile --python 3.9

      - name: Compile transliterators
        run: |
          uv run python -c "from fitrat.transliterators.cyr_lat.model_compile import model_compile; model_compile()"
          uv run python -c "from fitrat.transliterators.lat_cyr.model_compile import model_compile; model_compile()"
